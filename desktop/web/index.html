<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>Wikidict</title><link rel="stylesheet" href="style.css"><script type="module" src="app.js"></script></head>
<body><main id="main"><p id="status" role="status" aria-live="polite"></p><section id="panel"></section><article id="entry" aria-label="Dictionary entry" tabindex="-1"></article></main>
<input id="file" type="file" accept=".wikblb,.xz,application/octet-stream,application/x-xz" hidden>
<nav id="dock" aria-label="Main navigation"><button data-page="saved" aria-label="Saved">♧</button><button data-page="history" aria-label="History">↶</button><button data-page="search" aria-label="Search">⌕</button><button data-page="learn" aria-label="Learn">◇</button><button data-page="settings" aria-label="Settings">⚙</button></nav>
</body></html>
