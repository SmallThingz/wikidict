buildscript {
    repositories { google(); mavenCentral(); gradlePluginPortal() }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.2.0'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.3.0'
        classpath 'org.jetbrains.kotlin.plugin.compose:org.jetbrains.kotlin.plugin.compose.gradle.plugin:2.3.0'
    }
}
apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

repositories { google(); mavenCentral() }

configurations.configureEach {
    exclude group: 'androidx.graphics', module: 'graphics-path'
}

import org.jetbrains.kotlin.gradle.dsl.JvmTarget
kotlin { compilerOptions { jvmTarget = JvmTarget.JVM_17 } }

android {
    namespace = 'app.smallthingz.dict'
    compileSdk = 37
    buildToolsVersion = '37.0.0'
    defaultConfig {
        applicationId 'app.smallthingz.dict'
        minSdk = 28
        targetSdk = 37
        versionCode 2
        versionName '0.2.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures { compose = true; buildConfig = false }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging { resources { excludes += ['META-INF/LICENSE*', 'META-INF/AL2.0', 'META-INF/LGPL2.1'] } }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.18.0'
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.10.0'
    implementation platform('androidx.compose:compose-bom:2026.05.01')
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation platform('androidx.compose:compose-bom:2026.05.01')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
}

// All reader surfaces test the same JSON exported from freshly verified blobs.
android.sourceSets.androidTest.assets.srcDir(layout.buildDirectory.dir('generated/rendererFixtures').get().asFile)
tasks.register('stageRendererFixture', Copy) {
    if (providers.gradleProperty('rendererFixture').isPresent()) {
        from(providers.gradleProperty('rendererFixture'))
        rename { 'renderer-fixture.json' }
    }
    into(layout.buildDirectory.dir('generated/rendererFixtures'))
}
tasks.configureEach { if (name == 'preDebugAndroidTestBuild') dependsOn('stageRendererFixture') }

tasks.register('stageCorpusFixture', Copy) {
    if (providers.gradleProperty('corpusFixture').isPresent()) {
        from(providers.gradleProperty('corpusFixture'))
        rename { 'corpus-fixture.json' }
    }
    into(layout.buildDirectory.dir('generated/rendererFixtures'))
}
tasks.configureEach { if (name == 'preDebugAndroidTestBuild') dependsOn('stageCorpusFixture') }
