<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>Dict · Reader</title><link rel="stylesheet" href="style.css"><script type="module" src="app.js"></script></head>
<body><header><a class="brand" href="./" aria-label="Dict home">Dict<span> / reader</span></a><div class="actions"><button id="theme" title="Change theme" aria-label="Change theme">◐</button><button id="open" title="Open dictionary" aria-label="Open dictionary">↥</button><input type="file" id="file" accept="application/json,.json" hidden></div></header>
