buildscript {
    repositories { google(); mavenCentral(); gradlePluginPortal() }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.2.0'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.3.0'
        classpath 'org.jetbrains.kotlin.plugin.compose:org.jetbrains.kotlin.plugin.compose.gradle.plugin:2.3.0'
    }
}
apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

repositories { google(); mavenCentral() }

configurations.configureEach {
    exclude group: 'androidx.graphics', module: 'graphics-path'
}

import org.jetbrains.kotlin.gradle.dsl.JvmTarget
kotlin { compilerOptions { jvmTarget = JvmTarget.JVM_17 } }

android {
    namespace = 'app.smallthingz.dict'
    compileSdk = 37
    buildToolsVersion = '37.0.0'
    ndkVersion = '29.0.14206865'
    defaultConfig {
        applicationId 'app.smallthingz.dict'
        minSdk = 31
        targetSdk = 37
        versionCode 4
        versionName '0.4.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        ndk { abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64' }
        externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_static' } }
    }
    buildTypes {
        debug {
            if (providers.gradleProperty('isolatedValidation').getOrElse('false').toBoolean()) applicationIdSuffix '.validation'
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    // Locally installable optimized build; release signing remains separate.
    buildTypes {
        performance {
            initWith release
            if (providers.gradleProperty('isolatedValidation').getOrElse('false').toBoolean()) applicationIdSuffix '.validation'
            signingConfig signingConfigs.debug
            debuggable false
            matchingFallbacks = ['release']
        }
    }
    externalNativeBuild { cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.22.1' } }
    buildFeatures { compose = true; buildConfig = true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging { resources { excludes += ['META-INF/LICENSE*', 'META-INF/AL2.0', 'META-INF/LGPL2.1'] } }
}

dependencies {
    implementation 'org.tukaani:xz:1.12'
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'androidx.core:core-ktx:1.18.0'
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.10.0'
    implementation platform('androidx.compose:compose-bom:2026.05.01')
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation platform('androidx.compose:compose-bom:2026.05.01')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
}
